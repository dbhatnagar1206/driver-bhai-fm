<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>Driver Bhai FM 🚌</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    background:
      radial-gradient(circle at 50% 15%, #3b3b3b 0%, #171717 38%, #070707 75%);
    display:flex; align-items:center; justify-content:center;
    overflow-x:hidden;
  }
  .page{width:100%; max-width:520px; min-height:100vh; padding:24px 16px 30px; display:flex; flex-direction:column; justify-content:center}
  .brand{text-align:center; margin-bottom:18px}
  .brand .bus{font-size:52px; filter:drop-shadow(0 4px 10px #000)}
  h1{font-size:32px; margin:5px 0 4px; letter-spacing:1px}
  .tag{color:#c7c7c7; font-size:14px}
  .dashboard{
    border:1px solid #444; border-radius:26px; padding:18px;
    background:linear-gradient(145deg,#222,#0d0d0d);
    box-shadow:0 20px 60px rgba(0,0,0,.65);
  }
  .road{
    height:120px; border-radius:18px; overflow:hidden; position:relative;
    background:linear-gradient(#172b48 0 55%,#242424 56%);
    border:1px solid #3d3d3d;
  }
  .road:before{
    content:""; position:absolute; left:50%; top:58%; width:7px; height:90px;
    transform:translateX(-50%); background:repeating-linear-gradient(to bottom,#eee 0 18px,transparent 18px 34px);
    opacity:.7;
  }
  .city{position:absolute; bottom:44%; width:100%; height:42px; opacity:.65;
    background:linear-gradient(90deg,transparent 0 8%,#323232 8% 17%,transparent 17% 21%,#454545 21% 31%,transparent 31% 36%,#292929 36% 52%,transparent 52% 58%,#3c3c3c 58% 72%,transparent 72% 78%,#292929 78% 91%,transparent 91%);
  }
  .controls{display:flex; gap:10px; justify-content:center; margin:16px 0 12px}
  button{
    border:1px solid #555; background:#202020; color:#fff; border-radius:999px;
    padding:12px 18px; font-size:14px; cursor:pointer;
  }
  button:hover{background:#303030}
  .start{width:100%; background:#fff; color:#111; font-weight:700; border:0; padding:14px}
  .status{text-align:center; font-size:12px; color:#aaa; margin:10px 0}
  .spotify{
    margin-top:14px; border-radius:16px; overflow:hidden; background:#111;
    min-height:152px;
  }
  .spotify iframe{display:block; width:100%; height:152px; border:0}
  .empty{
    padding:24px 18px; text-align:center; color:#aaa; font-size:13px; line-height:1.5
  }
  .hint{font-size:11px;color:#777;text-align:center;margin-top:14px}
  .lights{display:flex;justify-content:space-between;margin:0 6px 10px}
  .light{width:10px;height:10px;border-radius:50%;background:#555;box-shadow:0 0 0 2px #111}
</style>
</head>
<body>
<main class="page">
  <section class="brand">
    <div class="bus">🚌</div>
    <h1>DRIVER BHAI FM</h1>
    <div class="tag">Safar lamba ho, gaane purane hone chahiye.</div>
  </section>

  <section class="dashboard">
    <div class="lights"><span class="light"></span><span class="light"></span></div>
    <div class="road"><div class="city"></div></div>

    <div class="controls">
      <button onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">🎵 Music</button>
    </div>

    <button class="start" onclick="startTrip()">🔑 START ENGINE</button>
    <div id="status" class="status">Driver bhai ready hai…</div>

    <div class="spotify" id="spotify">
      <div class="empty">
        <b>Spotify playlist yahan aayegi 🎶</b><br><br>
        Apni public Spotify playlist ka ID <code>YOUR_PLAYLIST_ID</code> ki jagah
        index.html mein paste karo.
      </div>
    </div>
    <div class="hint">Original songs Spotify se play honge. Website par MP3 upload karne ki zarurat nahi.</div>
  </section>
</main>

<script>
function startTrip(){
  document.getElementById('status').textContent =
    '🚌 Engine ON — Driver bhai, safar shuru!';
}
</script>
</body>
</html>
